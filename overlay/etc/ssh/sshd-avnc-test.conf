# VNC-only SSH endpoint; rendered by installer.
Port 2222
ListenAddress @PRINTER_IP@
HostKey /etc/ssh/s1_avnc_ecdsa_key
PidFile /run/s1/sshd-avnc.pid
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication no
UsePAM no
AllowUsers root
KexAlgorithms ecdh-sha2-nistp256
HostKeyAlgorithms ecdsa-sha2-nistp256
Ciphers aes128-ctr,aes256-ctr
MACs hmac-sha2-256,hmac-sha2-512
AllowTcpForwarding local
PermitOpen 127.0.0.1:5911
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
MaxSessions 0
LogLevel VERBOSE
